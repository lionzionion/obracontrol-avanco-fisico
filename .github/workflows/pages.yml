name: Validar e publicar ObraControl

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Validar e publicar site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar itens e código
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const items = JSON.parse(fs.readFileSync('itens.json', 'utf8'));
          const html = fs.readFileSync('index.html', 'utf8');
          if (items.length !== 70) throw Error('Esperados 70 itens');
          if (new Set(items.map(i => i.id)).size !== items.length) throw Error('IDs duplicados');
          if (items.some(i => !i.id || !i.description || i.planned <= 0)) throw Error('Item físico inválido');
          if (items.some(i => Object.keys(i).some(k => /preco|price|valor|custo/i.test(k)))) throw Error('Catálogo com valor financeiro');
          const script = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!script) throw Error('Script do aplicativo não encontrado');
          fs.writeFileSync('/tmp/obracontrol.js', script[1]);
          const inline = script[1].match(/const ITEMS=(\[[^\n]*\]);/);
          if (!inline || JSON.stringify(JSON.parse(inline[1])) !== JSON.stringify(items)) throw Error('Catálogos divergentes');
          console.log('Validados: ' + items.length + ' itens; sem campos monetários');
          NODE
          node --check /tmp/obracontrol.js
          node --check rl-brand.js
          node --check bm-module.js
          node --check rdo-module.js
          node --check central/dashboard.js
          node --check central/enhancements.js
          node --check central/ui-icons.js
          node --check central/rdo-board.js
          test -s central/rdo-board.css
          node <<'NODE'
          const fs=require('node:fs');
          const script=fs.readFileSync('central/rdo-board.js','utf8');
          const page=fs.readFileSync('central/index.html','utf8');
          if (/\.\s*(insert|update|upsert|delete|remove)\s*\(/.test(script)) throw Error('A área da Diretoria não pode gravar RDOs');
          for (const field of ['screen-rdos','rdoList','rdoDetail','rdoQuickApproved','rdoDownloadPdf']) {
            if (!page.includes(field) && !script.includes(field)) throw Error('Componente RDO ausente: '+field);
          }
          if (!script.includes('obc-rdo-pdfs') || !script.includes('obc-fotos')) throw Error('Armazenamento do RDO não configurado');
          console.log('Verificado: módulo RDO somente leitura, com PDF privado e galeria protegida');
          NODE
          test -s central/index.html
          test -s central/dashboard.css
          test -s central/premium.css
          grep -q 'dashboard.js' central/index.html
          grep -q 'enhancements.js' central/index.html
          grep -q 'ui-icons.js' central/index.html
          grep -q 'rdo-board.js' central/index.html
          grep -q 'rdo-board.css' central/index.html
          grep -q 'premium.css' central/index.html
          grep -q 'id="focusServiceSelect"' central/index.html
          grep -q 'id="dailyServiceSelect"' central/index.html
          grep -q 'id="workFrame"' central/index.html
          test -s assets/rl-logo.svg
          test -s rl-theme.css
          test -s bm-theme.css
          test -s rdo-theme.css
          grep -q 'rl-theme.css' index.html
          grep -q 'rl-brand.js' index.html
          grep -q 'bm-module.js' index.html
          grep -q 'rdo-module.js' index.html
          grep -q 'id="rdoApp"' index.html
          mkdir -p dist/assets
          cp index.html itens.json manifest.webmanifest icon.svg sw.js rl-theme.css rl-brand.js bm-module.js bm-theme.css rdo-module.js rdo-theme.css dist/
          cp assets/rl-logo.svg dist/assets/
          cp -r central dist/central
          touch dist/.nojekyll

      - name: Preparar Python para imagem social
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar prévia de compartilhamento com a marca RL
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/lionzionion/pedidos-almoco-Rlconstrucoes/main/assets/rl-logo.webp \
            --output /tmp/rl-logo-oficial.webp
          python central/build-social-image.py /tmp/rl-logo-oficial.webp dist/central/preview-rl.jpg
          test -s dist/central/preview-rl.jpg
          grep -q 'og:image' dist/central/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar site para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
